# Testes automáticos do GESLIC.
#
# Rodam em todo push e em todo pull request para a main:
# - backend: os testes de API (node:test) contra um MySQL 8.0 temporário.
#   Cada arquivo de teste recria do zero o banco geslic_teste_automatico com
#   os dados de exemplo (backend/tests/ajuda.js); nada fica salvo depois.
# - frontend: o build de produção (vite build), que falha com erro de
#   sintaxe, import quebrado ou arquivo faltando.
#
# A senha do MySQL abaixo é só deste banco descartável da CI.

name: CI

on:
  push:
  pull_request:
    branches: [main]

# Um push novo no mesmo branch cancela a execução anterior ainda em andamento
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (testes de API)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    defaults:
      run:
        working-directory: backend

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_SENHA: ci_root

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Rodar os testes
        run: npm test

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o build
        run: npm run build
